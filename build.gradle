plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.0'
base.archivesName = "modid"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ========== Maven 仓库 ==========
repositories {
    mavenCentral()
    
    // 阿里云镜像（加速下载）
    maven {
        name = "阿里云"
        url = "https://maven.aliyun.com/repository/public"
    }
    
    maven {
        name = "NeoForge"
        url = "https://maven.neoforged.net/releases/"
    }
    
    // Minecraft 官方库
    maven {
        name = "Minecraft Libraries"
        url = "https://libraries.minecraft.net/"
    }
    
    // ========== 添加 JEI 仓库（关键！） ==========
    maven {
        name = "JEI"
        url = "https://maven.blamejared.com/"
    }
    // 备用 JEI 仓库
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev/"
    }
}

// ========== 依赖管理 ==========
dependencies {
    // JEI API（编译时需要）
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247"
    // 或者使用不带 -api 的版本
    // compileOnly "mezz.jei:jei-1.21.1-neoforge:19.21.0.247"
}

neoForge {
    version = "21.1.232"

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: 'mcreator.gradle'